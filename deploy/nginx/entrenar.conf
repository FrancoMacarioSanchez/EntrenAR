# /etc/nginx/sites-available/entrenar.conf
# Dominio base: entrenar.corexit.tech  → landing, alta, /corex-admin/ y la API CoreX (/corex/v1/)
# Gimnasios:    <slug>.entrenar.corexit.tech → panel, /app/ (PWA) y /api/v1/
# Requiere certificado WILDCARD (*.entrenar.corexit.tech) → certbot con desafío DNS (ver DEPLOY.md).

upstream entrenar_app { server 127.0.0.1:8082; keepalive 16; }

server {
    listen 80;
    server_name entrenar.corexit.tech *.entrenar.corexit.tech;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name entrenar.corexit.tech *.entrenar.corexit.tech;

    ssl_certificate     /etc/letsencrypt/live/entrenar.corexit.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/entrenar.corexit.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;            # fotos de comidas y de progreso
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/entrenar.access.log;
    error_log  /var/log/nginx/entrenar.error.log warn;

    location /static/ {
        alias /srv/entrenar/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media: media/<schema>/<carpeta>/<uuid>.jpg → nombres aleatorios imposibles de adivinar y sin listado.
    location /media/ {
        alias /srv/entrenar/backend/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://entrenar_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;         # análisis con IA: hasta ~2 intentos de 45 s
        proxy_send_timeout 60s;
    }
}
