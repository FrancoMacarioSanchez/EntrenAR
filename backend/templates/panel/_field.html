<div class="field{% if field.widget_type == 'checkbox' %} inline{% endif %}{% if field.widget_type == 'textarea' or field.widget_type == 'clearablefile' %} wide{% endif %}">
  {% if field.widget_type == 'checkbox' %}{{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>{{ field }}{% endif %}
  {% if field.help_text %}<span class="help">{{ field.help_text|safe }}</span>{% endif %}
  {% for e in field.errors %}<span class="error">{{ e }}</span>{% endfor %}
</div>
