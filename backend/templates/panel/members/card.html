{% load static %}<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Credencial · {{ m.full_name }}</title>
<link rel="stylesheet" href="{% static 'panel/panel.css' %}"><style>:root{--brand: {{ gym_settings.primary_color }}}
.cred{width:340px;margin:40px auto;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.2);background:#fff;color:#111;font-family:Inter,system-ui}
.cred .top{background:var(--brand);color:#fff;padding:18px 22px}.cred .body{padding:22px;text-align:center}
#qr svg{width:210px;height:210px}</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script></head>
<body style="background:#eee"><div class="cred">
  <div class="top"><b style="font-size:18px">{{ gym_settings.display_name }}</b><br><small style="color:#fff;opacity:.85">Credencial de socio</small></div>
  <div class="body"><div id="qr"></div><h2 style="margin-top:10px">{{ m.full_name }}</h2>
    <p style="margin:4px 0;color:#666">DNI {{ m.dni|default:"—" }} · Código {{ m.access_code }}</p>
    <small style="color:#888">Mostrá este QR en recepción o desde la app.</small></div></div>
<p class="no-print" style="text-align:center"><button class="btn primary" onclick="print()">Imprimir</button></p>
<script>const q=qrcode(0,'M');q.addData("{{ m.access_code }}");q.make();document.getElementById('qr').innerHTML=q.createSvgTag({cellSize:6,margin:2});</script>
</body></html>
